name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI never contacts a live AI provider. The mock adapter makes the suite
# deterministic and guarantees a pull request can never spend the AI budget.
env:
  AI_PROVIDER: mock
  ENVIRONMENT: test
  SECRET_KEY: ci-secret-key-not-used-outside-ci
  DATABASE_URL_OVERRIDE: "sqlite+pysqlite:///:memory:"

jobs:
  backend:
    name: Backend (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Pytest
        run: pytest -q

      - name: Export OpenAPI schema
        run: python -m scripts.export_openapi

      - name: Upload OpenAPI schema
        uses: actions/upload-artifact@v7
        with:
          name: openapi-schema
          path: backend/openapi.json

  frontend:
    name: Frontend (lint · types · build)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download OpenAPI schema
        uses: actions/download-artifact@v8
        with:
          name: openapi-schema
          path: backend

      # The decisive check: regenerate types from the backend's live schema and
      # fail if the committed file differs. This is what makes it impossible for
      # the frontend types to drift from the Python contract.
      - name: Verify generated types are in sync
        run: |
          npm run gen:types
          git diff --exit-code -- src/types/api.ts \
            || (echo "::error::frontend/src/types/api.ts is stale. Run 'npm run gen:types' and commit." && exit 1)

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Build
        run: npm run build
